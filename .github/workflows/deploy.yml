name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # NOTE: `static_site_generator: next` is intentionally omitted.
      # configure-pages only detects next.config.{js,cjs,mjs} and would generate
      # a conflicting blank `next.config.js` (overriding our `next.config.ts`),
      # which suppresses `output: 'export'` and prevents the `out/` directory.
      # Static export + basePath are already fully configured in next.config.ts.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site with Next.js
        run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: '/procedural-3d-benchmarking'

      - name: Verify static export output
        run: |
          echo "Workspace contents:"
          ls -la
          if [ ! -d out ]; then
            echo "::error::Build did not produce an 'out/' directory. output: 'export' was not applied."
            exit 1
          fi
          echo "out/ contents:"
          ls -la out

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
